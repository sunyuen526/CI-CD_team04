name: CI - Web UI & Chart Render Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-visual-check:
    # 名稱不可更改：main 的 ruleset 要求的檢查名稱就是這個
    name: UI - App Launch & Screenshot Check
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 建置 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝套件、中文字型與無頭瀏覽器 (Playwright)
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      # expenses.csv 在 .gitignore 裡，CI 環境沒有資料時網頁不會出現任何圖表，
      # 所以先載入範例資料，確保真的有圖表可以檢查
      - name: 4. 載入範例記帳資料
        run: |
          cp sample_expenses.csv expenses.csv
          echo "已載入 $(($(wc -l < expenses.csv) - 1)) 筆範例資料"

      - name: 5. 背景啟動 expense_app.py 並等待網頁就緒
        env:
          MPLBACKEND: Agg
        run: |
          python expense_app.py > server.log 2>&1 &
          echo $! > server.pid
          # 每 0.5 秒檢查一次，最多等 30 秒（取代固定的 sleep 3，避免機器慢時誤判）
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/; then
              echo "網頁已在 $((i * 5 / 10)) 秒內啟動"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::expense_app.py 在 30 秒內沒有啟動"
          cat server.log
          exit 1

      - name: 6. 用瀏覽器驗證畫面、三種圖表並截圖
        run: |
          cat > ui_check.py << 'EOF'
          from playwright.sync_api import sync_playwright

          BASE = "http://127.0.0.1:8000"
          PNG_SIGNATURE = b"\x89PNG\r\n\x1a\n"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1280, "height": 900})

              # (1) 首頁正常載入
              response = page.goto(BASE, wait_until="networkidle")
              assert response.status == 200, f"網頁載入失敗，狀態碼: {response.status}"
              assert "No data yet" not in page.content(), "範例資料沒有被載入，頁面顯示 No data yet"

              # (2) 頁面上至少要有 1 張圖，而且每張都沒有破圖
              images = page.locator("img").all()
              assert len(images) >= 1, "頁面上找不到任何圖表"
              for idx, img in enumerate(images, start=1):
                  width = img.evaluate("el => el.complete ? el.naturalWidth : 0")
                  assert width > 0, f"第 {idx} 張圖表破圖或無法顯示！"
              print(f"首頁共 {len(images)} 張圖表，全部正常顯示")

              # (3) 三種圖表 API 都要回傳真正的 PNG 圖片
              for kind in ("pie", "bar", "trend"):
                  r = page.request.get(f"{BASE}/chart.png?kind={kind}")
                  assert r.status == 200, f"{kind} 圖表回傳狀態碼 {r.status}"
                  assert r.headers.get("content-type", "").startswith("image/png"), f"{kind} 圖表不是 PNG"
                  assert r.body().startswith(PNG_SIGNATURE), f"{kind} 圖表內容不是有效的 PNG"
                  print(f"{kind} 圖表正常（{len(r.body()):,} bytes）")

              # (4) 截圖：圓餅圖首頁 + 趨勢圖頁面
              page.screenshot(path="web_ui_preview.png", full_page=True)
              page.goto(f"{BASE}/?chart=trend", wait_until="networkidle")
              page.screenshot(path="web_ui_trend.png", full_page=True)
              browser.close()
              print("網頁開啟正常，所有圖表渲染無誤！")
          EOF
          python ui_check.py

      - name: 7. 關閉網頁伺服器
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
          if [ -f server.log ]; then echo "----- server.log -----"; cat server.log; fi

      - name: 8. 上傳網頁截圖供組員下載確認版面
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-screenshot
          path: |
            web_ui_preview.png
            web_ui_trend.png
          if-no-files-found: warn
