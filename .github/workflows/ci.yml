name: CI - Quality Check & Automated Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: CI - Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 建置 Python 3.11 執行環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝專案相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 靜態程式碼檢查 (Flake8 Linter)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 5. 執行 Pytest 自動化測試
        env:
          MPLBACKEND: Agg
        run: |
          pytest -v
